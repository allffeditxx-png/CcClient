name: build-1_21_11

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source zip
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 3 -type f -name '*.zip' ! -path './.git/*' | sort | tail -n 1)
          echo "Found zip: ${ZIP:-NONE}"
          test -n "${ZIP:-}"

          rm -rf /tmp/src
          mkdir -p /tmp/src
          unzip -q -o "$ZIP" -d /tmp/src

          GRADLE_FILE=$(find /tmp/src -maxdepth 4 -type f -name 'build.gradle' | head -n 1)
          echo "Found build.gradle: ${GRADLE_FILE:-NONE}"
          test -n "${GRADLE_FILE:-}"

          SRC_ROOT=$(dirname "$GRADLE_FILE")
          echo "SRC_ROOT=$SRC_ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build
        run: |
          set -euo pipefail
          test -n "${SRC_ROOT:-}"
          gradle -p "$SRC_ROOT" build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            ${{ env.SRC_ROOT }}/build/libs/*.jar
            !${{ env.SRC_ROOT }}/build/libs/*-sources.jar
            
