name: build-1_21_x

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21"
            yarn: "1.21+build.9"
            fabric: "0.102.0+1.21"
          - mc: "1.21.1"
            yarn: "1.21.1+build.3"
            fabric: "0.116.1+1.21.1"
          - mc: "1.21.2"
            yarn: "1.21.2+build.1"
            fabric: "0.105.0+1.21.2"
          - mc: "1.21.3"
            yarn: "1.21.3+build.2"
            fabric: "0.110.0+1.21.3"
          - mc: "1.21.4"
            yarn: "1.21.4+build.8"
            fabric: "0.110.0+1.21.4"
          - mc: "1.21.5"
            yarn: "1.21.5+build.1"
            fabric: "0.119.9+1.21.5"
          - mc: "1.21.6"
            yarn: "1.21.6+build.21"
            fabric: "0.127.0+1.21.6"
          - mc: "1.21.7"
            yarn: "1.21.7+build.8"
            fabric: "0.128.1+1.21.7"
          - mc: "1.21.8"
            yarn: "1.21.8+build.1"
            fabric: "0.129.0+1.21.8"
          - mc: "1.21.9"
            yarn: "1.21.9+build.1"
            fabric: "0.133.6+1.21.9"
          - mc: "1.21.10"
            yarn: "1.21.10+build.2"
            fabric: "0.138.4+1.21.10"
    steps:
      - uses: actions/checkout@v4

      - name: Unzip mod source zip
        run: |
          set -euo pipefail
          rm -rf /tmp/src
          mkdir -p /tmp/src

          FOUND_ROOT=""
          for z in $(find . -maxdepth 3 -type f -name '*.zip' ! -path './.git/*' | sort); do
            rm -rf /tmp/probe
            mkdir -p /tmp/probe
            unzip -q -o "$z" -d /tmp/probe || continue
            g=$(find /tmp/probe -maxdepth 5 -type f -name 'build.gradle' | head -n 1 || true)
            if [ -n "$g" ]; then
              rm -rf /tmp/src
              mv /tmp/probe /tmp/src
              FOUND_ROOT=$(cd "$(dirname "$(find /tmp/src -maxdepth 5 -type f -name 'build.gradle' | head -n 1)")" && pwd)
              echo "Using source archive: $z"
              echo "Project root: $FOUND_ROOT"
              break
            fi
          done

          rm -rf /tmp/probe
          if [ -z "$FOUND_ROOT" ]; then
            echo "::error::No zip archive containing build.gradle was found in the repository."
            exit 1
          fi

          echo "SRC_ROOT=$FOUND_ROOT" >> "$GITHUB_ENV"

      - name: Configure Minecraft ${{ matrix.mc }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re

          root = os.environ["SRC_ROOT"]
          mc = "${{ matrix.mc }}"
          yarn = "${{ matrix.yarn }}"
          fabric = "${{ matrix.fabric }}"

          gp_path = os.path.join(root, "gradle.properties")
          with open(gp_path, "r", encoding="utf-8") as f:
              gp = f.read()

          gp = re.sub(r"^minecraft_version=.*$", f"minecraft_version={mc}", gp, flags=re.M)
          gp = re.sub(r"^yarn_mappings=.*$", f"yarn_mappings={yarn}", gp, flags=re.M)
          gp = re.sub(r"^fabric_version=.*$", f"fabric_version={fabric}", gp, flags=re.M)

          with open(gp_path, "w", encoding="utf-8") as f:
              f.write(gp)

          fmj_path = os.path.join(root, "src", "main", "resources", "fabric.mod.json")
          with open(fmj_path, "r", encoding="utf-8") as f:
              fmj = f.read()

          fmj = re.sub(r'"minecraft"\s*:\s*"[^"]+"', f'"minecraft": "~{mc}"', fmj)
          with open(fmj_path, "w", encoding="utf-8") as f:
              f.write(fmj)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build JAR
        run: |
          set -euo pipefail
          gradle -p "$SRC_ROOT" build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: |
            ${{ env.SRC_ROOT }}/build/libs/*.jar
            !${{ env.SRC_ROOT }}/build/libs/*-sources.jar
            !${{ env.SRC_ROOT }}/build/libs/*-dev.jar

  bundle-all-jars:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/all-jars
          pattern: jar-*
          merge-multiple: true

      - name: Zip all built JARs into one archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/bundle
          if ls /tmp/all-jars/*.jar >/dev/null 2>&1; then
            zip -j /tmp/bundle/cctiers-client-all-versions.zip /tmp/all-jars/*.jar
          else
            echo "::error::No built JARs were produced by any matrix job."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cctiers-client-all-jars
          path: /tmp/bundle/cctiers-client-all-versions.zip
          
